<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nebula Browser</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div class="browser">
 <div class="tabbar"><div class="brand">✦ Nebula</div><div id="tabList" class="tablist" role="tablist" aria-label="Browser tabs"></div><button id="newTab" title="New tab" aria-label="New tab">＋</button></div>
 <div class="toolbar">
  <button id="back" title="Back" aria-label="Back">←</button><button id="forward" title="Forward" aria-label="Forward">→</button>
  <button id="refresh" title="Refresh" aria-label="Refresh">↻</button><button id="home" title="Home" aria-label="Home">⌂</button>
  <form id="addressForm"><span>⌕</span><input id="address" aria-label="Search or enter URL" placeholder="Search Nebula or enter a URL" autocomplete="off"><button type="submit">Go</button></form>
  <button id="bookmark" title="Bookmark this page" aria-label="Bookmark">☆</button><button id="showBookmarks" title="Bookmarks" aria-label="Show bookmarks">☷</button>
 </div>
 <div id="bookmarksPanel" class="bookmarks" hidden><strong>Bookmarks</strong><div id="bookmarksList"></div></div>
 <main id="viewport" aria-live="polite"></main>
 <div class="status">Nebula Browser · Embedded websites may block display · Search results from Wikipedia</div>
</div>
<script src="/script.js"></script></body></html>
